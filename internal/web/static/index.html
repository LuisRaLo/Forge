<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ai-squad</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #e0e0e5;
    --text: #1a1a1e;
    --text-dim: #6b6b74;
    --accent: #3860f0;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171b;
      --panel: #202024;
      --border: #303036;
      --text: #ececef;
      --text-dim: #97979f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text);
    display: grid; grid-template-columns: 340px 1fr; height: 100vh; overflow: hidden;
  }
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c33; flex-shrink: 0; }
  .dot.live { background: #2ea043; }
  .conn-label { font-size: 12px; color: var(--text-dim); }
  .cost { margin-left: auto; font-size: 12px; color: var(--text-dim); font-family: var(--mono); }

  aside {
    border-right: 1px solid var(--border); padding: 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 14px;
  }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); margin: 0 0 4px; }

  .dropzone {
    border: 2px dashed var(--border); border-radius: 8px; padding: 20px 12px;
    text-align: center; font-size: 13px; color: var(--text-dim); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .dropzone.drag { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .dropzone input { display: none; }

  label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  input[type=text], select, textarea {
    width: 100%; padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--text); font-size: 13px; font-family: var(--sans);
  }
  textarea { font-family: var(--mono); font-size: 12px; resize: vertical; min-height: 70px; }
  .field { margin-bottom: 10px; }

  .steps { display: flex; flex-direction: column; gap: 6px; }
  .step-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .step-row input { margin: 0; }
  .step-row .gate-badge {
    font-size: 10px; padding: 1px 5px; border-radius: 4px; background: #7a4de0; color: #fff;
  }

  button {
    border: none; border-radius: 6px; padding: 9px 12px; font-size: 13px; font-weight: 600;
    cursor: pointer; background: var(--accent); color: #fff;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 500; }

  main { overflow-y: auto; padding: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); padding: 6px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr.task-row { cursor: pointer; }
  tr.task-row:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
  tr.flash { animation: flash 900ms ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } to { background: transparent; } }

  .badge { font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
  .st-PENDING, .st-READY, .st-WAITING { background: #e5e5ea; color: #444; }
  .st-PLANNING, .st-RUNNING, .st-REVIEW { background: #dbe6ff; color: #1a4fd6; }
  .st-COMPLETED { background: #d7f5df; color: #157a3a; }
  .st-FAILED, .st-BLOCKED { background: #fbdadc; color: #ad1f2b; }
  .st-CANCELLED { background: #eee; color: #999; }
  .st-WAITING_APPROVAL { background: #fdeecb; color: #92660a; }

  .muted { color: var(--text-dim); }
  #detail { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; display: none; }
  #detail.open { display: block; }
  .detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .detail-head h3 { margin: 0; font-size: 14px; font-family: var(--mono); }
  .timeline { font-family: var(--mono); font-size: 12px; line-height: 1.7; }
  .timeline .row { display: flex; gap: 10px; }
  .timeline .t { color: var(--text-dim); flex-shrink: 0; }
  .empty { color: var(--text-dim); font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>

<header>
  <span class="dot" id="conn-dot"></span>
  <h1>ai-squad</h1>
  <span class="conn-label" id="conn-label">connecting…</span>
  <span class="cost" id="cost-label"></span>
</header>

<aside>
  <div>
    <h2>Spec</h2>
    <div class="dropzone" id="dropzone">
      Drag a spec file here, or click to choose<br>(.md / .txt)
      <input type="file" id="file-input" accept=".md,.txt,text/plain,text/markdown">
    </div>
  </div>

  <div class="field">
    <label for="title">Title</label>
    <input type="text" id="title" placeholder="Add Google authentication">
  </div>
  <div class="field">
    <label for="description">Description / spec</label>
    <textarea id="description" placeholder="Paste or drop a spec here…"></textarea>
  </div>
  <div class="field">
    <label for="repository">Repository path</label>
    <input type="text" id="repository" placeholder="/path/to/repo">
  </div>
  <div class="field">
    <label for="priority">Priority</label>
    <select id="priority">
      <option value="low">low</option>
      <option value="normal" selected>normal</option>
      <option value="high">high</option>
      <option value="critical">critical</option>
    </select>
  </div>

  <div>
    <h2>Steps</h2>
    <div class="steps" id="steps"></div>
  </div>

  <div class="field">
    <label for="runtime">Runtime <span class="muted">(who resolves this spec)</span></label>
    <select id="runtime">
      <option value="">Default (per-agent config)</option>
    </select>
  </div>

  <button id="create-btn">Create &amp; run</button>
  <div class="muted" id="create-error" style="font-size:12px;"></div>
</aside>

<main>
  <table>
    <thead>
      <tr><th>ID</th><th>Title</th><th>Status</th><th>Agent</th><th>Runtime</th><th>Step</th><th>Prio</th><th>Updated</th></tr>
    </thead>
    <tbody id="task-rows"></tbody>
  </table>
  <div class="empty" id="empty-state" style="display:none;">No tasks yet — create one on the left.</div>

  <div id="detail">
    <div class="detail-head">
      <h3 id="detail-id"></h3>
      <span class="badge" id="detail-status"></span>
      <button class="secondary" id="detail-cancel">Cancel</button>
      <button class="secondary" id="detail-retry">Retry</button>
      <button class="secondary" id="detail-close">Close</button>
    </div>
    <div class="timeline" id="detail-timeline"></div>
  </div>
</main>

<script>
const tasksById = new Map();
let selectedTaskId = null;

const AGENT_ORDER = ["architect", "developer", "qa", "reviewer", "devops"];
const DEFAULT_CHECKED = new Set(["developer", "qa"]);

function fmtTime(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  return d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
}

// Go's time.Duration serializes as an integer number of nanoseconds.
function fmtDuration(ns) {
  if (ns == null) return "-";
  const s = ns / 1e9;
  if (s < 1) return Math.round(ns / 1e6) + "ms";
  if (s < 60) return s.toFixed(1) + "s";
  return Math.floor(s / 60) + "m" + Math.round(s % 60) + "s";
}

function badge(status) {
  return `<span class="badge st-${status}">${status}</span>`;
}

async function loadAgents() {
  const res = await fetch("/api/agents");
  const agents = await res.json();
  const byName = new Map(agents.map(a => [a.name, a]));
  const ordered = AGENT_ORDER.filter(n => byName.has(n))
    .concat(agents.map(a => a.name).filter(n => !AGENT_ORDER.includes(n)));

  const container = document.getElementById("steps");
  container.innerHTML = "";
  for (const name of ordered) {
    const a = byName.get(name);
    const row = document.createElement("label");
    row.className = "step-row";
    row.innerHTML = `
      <input type="checkbox" value="${name}" ${DEFAULT_CHECKED.has(name) ? "checked" : ""}>
      <span>${name}</span>
      ${a.gate ? '<span class="gate-badge">gate</span>' : ""}
    `;
    container.appendChild(row);
  }
}

function selectedSteps() {
  // Checkboxes are inserted in pipeline order by loadAgents(), so reading
  // them in DOM order already yields the correct step sequence.
  return [...document.querySelectorAll("#steps input:checked")].map(i => i.value);
}

async function loadRuntimes() {
  const res = await fetch("/api/runtimes");
  const names = await res.json();
  const select = document.getElementById("runtime");
  for (const name of (names || [])) {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    select.appendChild(opt);
  }
}

function renderRow(task) {
  let row = document.getElementById("row-" + task.id);
  const isNew = !row;
  if (isNew) {
    row = document.createElement("tr");
    row.id = "row-" + task.id;
    row.className = "task-row";
    row.addEventListener("click", () => openDetail(task.id));
  }
  row.innerHTML = `
    <td class="muted">${task.id}</td>
    <td>${escapeHtml(task.title)}</td>
    <td>${badge(task.status)}</td>
    <td class="muted">${task.agent || "-"}</td>
    <td class="muted">${(task.metadata && task.metadata.runtime_override) || "default"}</td>
    <td class="muted">${task.step ?? 0}</td>
    <td class="muted">${task.priority}</td>
    <td class="muted">${fmtTime(task.updated_at)}</td>
  `;
  if (isNew) {
    document.getElementById("task-rows").prepend(row);
  } else {
    row.classList.remove("flash");
    void row.offsetWidth;
    row.classList.add("flash");
  }
  document.getElementById("empty-state").style.display =
    document.getElementById("task-rows").children.length ? "none" : "block";
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

function upsertTask(task) {
  tasksById.set(task.id, task);
  renderRow(task);
  if (selectedTaskId === task.id) openDetail(task.id);
}

async function openDetail(id) {
  selectedTaskId = id;
  const res = await fetch(`/api/tasks/${id}`);
  if (!res.ok) return;
  const detail = await res.json();
  const t = detail.task;

  document.getElementById("detail").classList.add("open");
  document.getElementById("detail-id").textContent = t.id + " — " + t.title;
  document.getElementById("detail-status").outerHTML = badge(t.status);
  document.getElementById("detail-status").id = "detail-status";

  const lines = [];
  for (const ev of (detail.events || [])) {
    lines.push({at: ev.created_at, text: `${ev.from_status || "-"} → ${ev.to_status}${ev.reason ? ": " + escapeHtml(ev.reason) : ""}`});
  }
  for (const r of (detail.runs || [])) {
    const cost = r.usage && r.usage.cost_usd != null ? ` cost=$${r.usage.cost_usd.toFixed(4)}` : "";
    lines.push({at: r.finished_at, text: `run agent=${r.agent} status=${r.status} duration=${fmtDuration(r.duration)}${cost}`});
  }
  lines.sort((a, b) => (a.at || "").localeCompare(b.at || ""));

  document.getElementById("detail-timeline").innerHTML = lines.map(l =>
    `<div class="row"><span class="t">${fmtTime(l.at)}</span><span>${l.text}</span></div>`
  ).join("") || `<div class="muted">No history yet.</div>`;
}

document.getElementById("detail-close").addEventListener("click", () => {
  selectedTaskId = null;
  document.getElementById("detail").classList.remove("open");
});
document.getElementById("detail-cancel").addEventListener("click", async () => {
  if (!selectedTaskId) return;
  await fetch(`/api/tasks/${selectedTaskId}/cancel`, {method: "POST"});
});
document.getElementById("detail-retry").addEventListener("click", async () => {
  if (!selectedTaskId) return;
  await fetch(`/api/tasks/${selectedTaskId}/retry`, {method: "POST"});
});

// --- spec dropzone ---
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("file-input");
dropzone.addEventListener("click", () => fileInput.click());
["dragenter", "dragover"].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add("drag"); }));
["dragleave", "drop"].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove("drag"); }));
dropzone.addEventListener("drop", e => handleFile(e.dataTransfer.files[0]));
fileInput.addEventListener("change", e => handleFile(e.target.files[0]));

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById("description").value = reader.result;
    if (!document.getElementById("title").value) {
      const firstLine = reader.result.split("\n").find(l => l.trim()) || file.name;
      document.getElementById("title").value = firstLine.replace(/^#+\s*/, "").slice(0, 120);
    }
  };
  reader.readAsText(file);
}

// --- create task ---
document.getElementById("create-btn").addEventListener("click", async () => {
  const errEl = document.getElementById("create-error");
  errEl.textContent = "";
  const steps = selectedSteps();
  if (steps.length === 0) {
    errEl.textContent = "select at least one step";
    return;
  }
  const title = document.getElementById("title").value.trim();
  if (!title) {
    errEl.textContent = "title is required";
    return;
  }
  const body = {
    title,
    description: document.getElementById("description").value,
    repository: document.getElementById("repository").value.trim(),
    priority: document.getElementById("priority").value,
    steps,
    runtime: document.getElementById("runtime").value,
  };
  const res = await fetch("/api/tasks", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({error: res.statusText}));
    errEl.textContent = err.error || "failed to create task";
    return;
  }
  document.getElementById("title").value = "";
  document.getElementById("description").value = "";
});

// --- websocket, real-time ---
function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/ws`);
  const dot = document.getElementById("conn-dot");
  const label = document.getElementById("conn-label");

  ws.onopen = () => { dot.classList.add("live"); label.textContent = "live"; };
  ws.onclose = () => {
    dot.classList.remove("live"); label.textContent = "reconnecting…";
    setTimeout(connect, 1500);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (msg) => {
    const ev = JSON.parse(msg.data);
    if (ev.type === "snapshot") {
      document.getElementById("task-rows").innerHTML = "";
      tasksById.clear();
      for (const t of (ev.tasks || [])) upsertTask(t);
      return;
    }
    if (ev.task) upsertTask(ev.task);
  };
}

loadAgents();
loadRuntimes();
connect();
</script>
</body>
</html>
